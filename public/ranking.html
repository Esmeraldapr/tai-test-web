<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ranking · Oposición TAI</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .ranking-pestanas { display: flex; gap: 8px; margin-bottom: 18px; }
  .ranking-pestana {
    flex: 1; text-align: center; padding: 10px; border-radius: 12px; cursor: pointer;
    background: var(--tarjeta); border: 1px solid var(--borde); font-weight: 700; font-size: 0.95rem;
  }
  .ranking-pestana.activa { background: var(--morado); color: #fff; border-color: var(--morado); }

  .ranking-caja-alias {
    background: linear-gradient(135deg, rgba(124,58,237,.1), rgba(124,58,237,.04));
    border: 2px solid rgba(124,58,237,.35); border-radius: 14px; padding: 16px 18px;
    margin-bottom: 20px; text-align: center;
  }
  .ranking-caja-alias input {
    width: 100%; max-width: 260px; padding: 10px 14px; border-radius: 999px;
    border: 1px solid var(--borde); font-size: 1rem; margin: 10px auto; display: block; text-align: center;
  }
  .ranking-caja-alias .btn { margin: 0 4px; }

  .ranking-mi-alias { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .ranking-mi-alias .chip {
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 999px;
    padding: 8px 16px; font-weight: 700;
  }
  .ranking-mi-alias button {
    background: none; border: none; color: var(--morado); font-weight: 700; cursor: pointer;
    text-decoration: underline; font-size: 0.9rem; padding: 0;
  }

  .ranking-lista { display: flex; flex-direction: column; gap: 8px; }
  .ranking-fila {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px;
  }
  .ranking-fila.mi-fila { border-color: var(--morado); border-width: 2px; background: rgba(124,58,237,.06); }
  .ranking-puesto { font-weight: 800; font-size: 1.1rem; width: 28px; text-align: center; flex-shrink: 0; }
  .ranking-puesto.medalla { font-size: 1.4rem; }
  .ranking-nombre { flex: 1; font-weight: 600; }
  .ranking-aciertos { font-weight: 800; color: var(--morado); white-space: nowrap; }

  .ranking-vacio { text-align: center; padding: 30px 16px; opacity: 0.85; }
  .ranking-vacio .btn { margin-top: 14px; }
</style>
</head>
<body>
  <div class="app-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-contenido">
      <div class="contenedor racha-doc">
        <h1>🏆 Ranking</h1>
        <p class="subtitulo">Voluntario — apúntate con el nombre que quieras y compite con quien más te apetezca.</p>
        <div id="banner-acceso"></div>
        <div id="contenido-ranking"><div class="spinner"></div></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/ranking.js"></script>
</body>
</html>
