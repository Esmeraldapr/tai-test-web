<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Conseguir acceso · Oposición TAI</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-contenido">
      <div class="contenedor" style="max-width:520px">
        <div class="panel" style="text-align:center">
          <div style="font-size:2.4rem">🔓</div>
          <h1>30 días de acceso completo</h1>
          <p class="subtitulo">Todas las preguntas de los 4 bloques y los 5 fundamentos, sin límite.</p>
          <div style="font-size:2rem;font-weight:900;margin:14px 0" id="precio-mostrado"></div>
          <button class="btn btn-primario btn-bloque" id="btn-pagar">Pagar con PayPal</button>
          <div id="estado-pago" style="margin-top:14px;font-size:.88rem"></div>
          <div id="aviso-ya-activo" class="mensaje-ok" style="display:none;text-align:left"></div>
        </div>

        <div class="panel" id="panel-codigo" style="text-align:center">
          <h2 style="margin-top:0">¿Tienes un código de acceso?</h2>
          <p class="subtitulo">Si te han dado un código (por ejemplo, porque ya pagabas en el bot de Telegram), canjéalo aquí.</p>
          <form id="form-codigo" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px">
            <input type="text" id="input-codigo" placeholder="Tu código" autocomplete="off"
              style="flex:1;min-width:180px;padding:10px 12px;border-radius:8px;border:1px solid var(--borde,#ddd);font-size:1rem;text-transform:uppercase" />
            <button type="submit" class="btn btn-secundario" id="btn-canjear">Canjear código</button>
          </form>
          <div id="estado-codigo" style="margin-top:12px;font-size:.88rem"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pago.js"></script>
</body>
</html>
