  "description": "Preguntas de muestra reales de Fundamentos de Informática del temario de la Oposición TAI (Técnico Auxiliar de Informática, AGE): arquitectura de computadores y sistemas digitales.",
  "url": "https://tai-test-web.onrender.com/test-gratis-tai.html",
  "educationalLevel": "Oposición administración pública",
  "about": [
    { "@type": "Thing", "name": "Arquitectura de computadores" },
    { "@type": "Thing", "name": "Sistemas digitales" },
    { "@type": "Thing", "name": "Fundamentos de informática" }
  ],
  "hasPart": [
    {
      "@type": "Question",
      "name": "La velocidad de reloj de un procesador se mide habitualmente en:",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Hercios (Hz). La frecuencia de reloj de la CPU, que indica cuántos ciclos realiza por segundo, se mide en Hercios, normalmente expresada en GHz (gigahercios) en los procesadores actuales."
      }
    },
    {
      "@type": "Question",
      "name": "La arquitectura que separa físicamente la memoria de datos de la memoria de instrucciones se conoce como:",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Harvard. A diferencia de Von Neumann, la arquitectura Harvard utiliza memorias y buses separados para instrucciones y datos, lo que permite acceder a ambos simultáneamente y mejorar el rendimiento."
      }
    },
    {
      "@type": "Question",
      "name": "1 Kilobyte (KB), en el estándar binario tradicional, equivale a:",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "1.024 bytes. Tradicionalmente en informática 1 KB = 2^10 = 1.024 bytes, aunque los fabricantes de discos suelen usar el múltiplo decimal (1.000) para sus especificaciones comerciales."
      }
    }
  ]

  <div class="cebo-header">
    <span class="cebo-gratis-chip">✅ Gratis · sin registro</span>
    <h1>Test gratis de la Oposición TAI</h1>
    <p class="subtitulo">3 preguntas reales de Fundamentos de Informática del temario de Técnico Auxiliar de Informática (AGE): arquitectura de computadores y sistemas digitales. Responde y mira al momento si aciertas y por qué.</p>
  </div>

  <div class="cebo-contenedor" id="cebo-preguntas"></div>

  <script>
    // Preguntas fijas, elegidas a mano del banco real de preguntas — NO se
    // consulta Supabase desde esta página pública, para no exponer el resto
    // del banco de preguntas (10.600+) a nadie que no haya pagado.
    const PREGUNTAS_MUESTRA = [
      {
        tema: "Informática · Arquitectura de computadores",
        pregunta: "La velocidad de reloj de un procesador se mide habitualmente en:",
        opciones: {
          a: "Bytes por segundo",
          b: "Hercios (Hz)",
          c: "Bits por pulgada",
          d: "Voltios",
        },
        correcta: "b",
        explicacion: "La frecuencia de reloj de la CPU, que indica cuántos ciclos realiza por segundo, se mide en Hercios, normalmente expresada en GHz (gigahercios) en los procesadores actuales.",
      },
      {
        tema: "Informática · Sistemas digitales",
        pregunta: "La arquitectura que separa físicamente la memoria de datos de la memoria de instrucciones se conoce como:",
        opciones: {
          a: "Von Neumann",
          b: "Harvard",
          c: "RISC",
          d: "CISC",
        },
        correcta: "b",
        explicacion: "A diferencia de Von Neumann, la arquitectura Harvard utiliza memorias y buses separados para instrucciones y datos, lo que permite acceder a ambos simultáneamente y mejorar el rendimiento.",
      },
      {
        tema: "Informática · Conceptos generales",
        pregunta: "1 Kilobyte (KB), en el estándar binario tradicional, equivale a:",
        opciones: {
          a: "1.000 bytes",
          b: "1.024 bytes",
          c: "100 bytes",
          d: "10.240 bytes",
        },
        correcta: "b",
        explicacion: "Tradicionalmente en informática 1 KB = 2^10 = 1.024 bytes, aunque los fabricantes de discos suelen usar el múltiplo decimal (1.000) para sus especificaciones comerciales.",
      },
    ];

    const contenedor = document.getElementById("cebo-preguntas");

    PREGUNTAS_MUESTRA.forEach((p, indice) => {
      const caja = document.createElement("div");
      caja.className = "pregunta-caja";
      caja.innerHTML = `
        <span class="cebo-tema-chip">${p.tema}</span>
        <div class="enunciado">${indice + 1}. ${p.pregunta}</div>
        <div class="opciones"></div>
      `;
      const opcionesDiv = caja.querySelector(".opciones");

      Object.entries(p.opciones).forEach(([letra, texto]) => {
        const btn = document.createElement("div");
        btn.className = "opcion";
        btn.innerHTML = `<span class="letra">${letra.toUpperCase()}</span><span>${texto}</span>`;
        btn.addEventListener("click", () => {
          if (caja.dataset.respondida) return;
          caja.dataset.respondida = "1";
          const todas = opcionesDiv.querySelectorAll(".opcion");
          todas.forEach((o) => o.classList.add("deshabilitada"));
          if (letra === p.correcta) {
            btn.classList.add("correcta");
          } else {
            btn.classList.add("incorrecta");
            const buena = [...todas].find((o) => o.querySelector(".letra").textContent.toLowerCase() === p.correcta);
            if (buena) buena.classList.add("correcta");
          }
          const explicacionDiv = document.createElement("div");
          explicacionDiv.className = "explicacion-caja " + (letra === p.correcta ? "bien" : "mal");
          explicacionDiv.innerHTML = `${letra === p.correcta ? "✅ ¡Correcto!" : "❌ Incorrecto."} ${p.explicacion}`;
          caja.appendChild(explicacionDiv);
        });
        opcionesDiv.appendChild(btn);
      });

      contenedor.appendChild(caja);
    });

    const cta = document.createElement("div");
    cta.className = "cebo-cta";
    cta.innerHTML = `
      <h2>¿Quieres seguir practicando?</h2>
      <p>Regístrate y prueba <strong>GRATIS 48 horas</strong> todo el temario completo: los 4 bloques oficiales y los 5 temarios de fundamentos, más de 10.600 preguntas. Después, acceso por 2,50€/30 días.</p>
      <a class="btn btn-primario" href="login.html">Crear mi cuenta gratis →</a>
      <span class="cebo-footer-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></span>
    `;
    contenedor.appendChild(cta);
  </script>
